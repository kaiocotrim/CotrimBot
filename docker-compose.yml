services:
  # Aplicação CotrimBot (frontend + backend)
  cotrimbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: cotrimbot-app
    restart: unless-stopped

    depends_on:
      - mysql
      - evolution-api
      - transcription

    ports:
      - "${APP_PORT}:${APP_PORT}"

    env_file:
      - .env

    # Dentro do Docker, os serviços são acessados pelos nomes do Compose.
    environment:
      DATABASE_URL: mysql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      EVOLUTION_API_URL: http://evolution-api:8080
      TRANSCRIPTION_SERVICE_URL: http://transcription:5000

  # Banco principal do CotrimBot
  mysql:
    image: mysql:8.4
    container_name: cotrimbot-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "${DATABASE_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  # Banco interno da Evolution API
  postgres:
    image: postgres:16
    container_name: cotrimbot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache da Evolution
  redis:
    image: redis:7
    container_name: cotrimbot-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

  # WhatsApp / Evolution API
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: cotrimbot-evolution
    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    ports:
      - "${EVOLUTION_PORT}:8080"

    environment:
      SERVER_URL: http://localhost:${EVOLUTION_PORT}
      SERVER_DISABLE_MANAGER: "false"

      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_CONNECTION_CLIENT_NAME: evolution

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"

      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      # A Evolution e o CotrimBot se comunicam pela rede interna do Compose.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://cotrimbot:${APP_PORT}/api/webhook/whatsapp
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "true"
    volumes:
      - evolution_instances:/evolution/instances

  # Microserviço de transcrição de áudio (faster-whisper)
  transcription:
    build:
      context: ./transcription-service
      dockerfile: Dockerfile
    container_name: cotrimbot-transcription
    restart: unless-stopped

    # Sem porta publicada: só o container cotrimbot acessa via rede interna do Compose.
    volumes:
      - whisper_models:/root/.cache/huggingface

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  evolution_instances:
  whisper_models:
